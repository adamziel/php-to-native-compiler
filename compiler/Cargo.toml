[package]
name = "phpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "php_compiler"
path = "src/lib.rs"

[[bin]]
name = "phpc"
path = "src/main.rs"

[dependencies]
bcrypt = "0.19.1"
crypt3_rs = "0.1.1"
libc = "0.2"
md2 = "0.11"
md4 = "0.11"
md-5 = "0.10"
gost94 = "0.10"
murmur3 = "0.5"
php_runtime = { path = "../runtime" }
regex = "1"
ripemd = "0.2"
sha2 = "0.10"
sha3 = "0.10"
tiger = "0.3"
whirlpool = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }
