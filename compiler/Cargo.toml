[package]
name = "phpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "php_compiler"
path = "src/lib.rs"

[[bin]]
name = "phpc"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8"
hmac = "0.12"
md-5 = "0.10"
php_runtime = { path = "../runtime" }
sha2 = "0.10"
