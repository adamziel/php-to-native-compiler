[package]
name = "phpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "php_compiler"
path = "src/lib.rs"

[[bin]]
name = "phpc"
path = "src/main.rs"

[dependencies]
md2 = "0.11"
md4 = "0.11"
md-5 = "0.10"
php_runtime = { path = "../runtime" }
regex = "1"
sha2 = "0.10"
sha3 = "0.10"
whirlpool = "0.10"
