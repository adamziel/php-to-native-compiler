name: Full PHPT Corpus

on:
  workflow_dispatch:
    inputs:
      php_src_ref:
        description: php/php-src ref to test
        required: true
        default: 8c63ec400ce8e07c57a8d9499317b96a8beafb8b
      timeout_seconds:
        description: Per-PHPT timeout passed to run-tests.php
        required: true
        default: "300"
      run_tests_jobs:
        description: Parallel run-tests.php workers per shard
        required: true
        default: "8"
      shard_count:
        description: Number of full-corpus shards to split the run into
        required: true
        default: "480"

permissions:
  contents: read

concurrency:
  group: full-phpt-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-full-phpt-shards:
    name: plan full PHPT shards
    runs-on: ubuntu-latest
    outputs:
      first_shards: ${{ steps.shards.outputs.first_shards }}
      second_shards: ${{ steps.shards.outputs.second_shards }}

    steps:
      - name: Build shard matrix
        id: shards
        run: |
          set -euo pipefail
          shard_count='${{ inputs.shard_count }}'
          if ! [[ "$shard_count" =~ ^[0-9]+$ ]] || [[ "$shard_count" -le 1 ]]; then
            echo "shard_count must be an integer greater than 1: $shard_count" >&2
            exit 1
          fi
          python3 - "$shard_count" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          count = int(sys.argv[1])
          split = (count + 1) // 2
          if split > 256 or count - split > 256:
              raise SystemExit(f"shard_count={count} exceeds the two-matrix limit")
          print("first_shards=" + json.dumps(list(range(split))))
          print("second_shards=" + json.dumps(list(range(split, count))))
          PY

  full-phpt-shard-a:
    name: shard ${{ matrix.shard }}/${{ inputs.shard_count }}
    needs: [plan-full-phpt-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 2880
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan-full-phpt-shards.outputs.first_shards) }}

    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4

      - name: Checkout PHPT corpus
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: ${{ inputs.php_src_ref }}
          path: .runtime/php-src-phpt

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld pkg-config php-cli

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Generate full-corpus shard
        env:
          PHP_SRC_PHPT: ${{ github.workspace }}/.runtime/php-src-phpt
        run: |
          tools/phpt-full-corpus-shard.sh \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ inputs.shard_count }}" \
            --out ".runtime/full-phpt-shards/shard-${{ matrix.shard }}.txt"

      - name: Run full-corpus shard
        env:
          PHP_SRC_PHPT: ${{ github.workspace }}/.runtime/php-src-phpt
          PHPT_PROGRESS_DIR: ${{ github.workspace }}/.runtime/full-phpt-results/shard-${{ matrix.shard }}
          PTN_PHPT_TEST_TIMEOUT: ${{ inputs.timeout_seconds }}
          PTN_PHPT_RUN_TESTS_JOBS: ${{ inputs.run_tests_jobs }}
          PTN_PHPT_SHARD_TIMEOUT_MINUTES: "120"
        run: |
          set +e
          set -uo pipefail
          mkdir -p "$PHPT_PROGRESS_DIR"
          # Keep PHPT child processes in a separate session so signal-heavy tests
          # cannot kill the runner shell before shard artifacts are uploaded.
          setsid timeout --kill-after=30s "${PTN_PHPT_SHARD_TIMEOUT_MINUTES}m" \
            tools/run-bounded-phpt.sh \
            --classify-harness-programs \
            ".runtime/full-phpt-shards/shard-${{ matrix.shard }}.txt" &
          phpt_pid=$!
          while kill -0 "$phpt_pid" 2>/dev/null; do
            sleep 60
            echo "[full-phpt] shard ${{ matrix.shard }}/${{ inputs.shard_count }} still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          done
          set +e
          wait "$phpt_pid"
          shard_exit=$?
          echo "$shard_exit" > "$PHPT_PROGRESS_DIR/shard-exit-code.txt"
          echo "[full-phpt] shard ${{ matrix.shard }}/${{ inputs.shard_count }} exited with $shard_exit"
          exit 0

      - name: Upload shard artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpt-full-corpus-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            .runtime/full-phpt-shards/shard-${{ matrix.shard }}.txt
            .runtime/full-phpt-results/shard-${{ matrix.shard }}/**

      - name: Fail shard on nonzero PHPT exit
        if: ${{ always() }}
        run: |
          exit_code_path=".runtime/full-phpt-results/shard-${{ matrix.shard }}/shard-exit-code.txt"
          if [[ ! -f "$exit_code_path" ]]; then
            echo "missing shard exit code: $exit_code_path" >&2
            exit 1
          fi
          exit_code="$(cat "$exit_code_path")"
          if [[ "$exit_code" != "0" ]]; then
            echo "PHPT shard ${{ matrix.shard }}/${{ inputs.shard_count }} failed with exit code $exit_code" >&2
            exit "$exit_code"
          fi

  full-phpt-shard-b:
    name: shard ${{ matrix.shard }}/${{ inputs.shard_count }}
    needs: [plan-full-phpt-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 2880
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan-full-phpt-shards.outputs.second_shards) }}

    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4

      - name: Checkout PHPT corpus
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: ${{ inputs.php_src_ref }}
          path: .runtime/php-src-phpt

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld pkg-config php-cli

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Generate full-corpus shard
        env:
          PHP_SRC_PHPT: ${{ github.workspace }}/.runtime/php-src-phpt
        run: |
          tools/phpt-full-corpus-shard.sh \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ inputs.shard_count }}" \
            --out ".runtime/full-phpt-shards/shard-${{ matrix.shard }}.txt"

      - name: Run full-corpus shard
        env:
          PHP_SRC_PHPT: ${{ github.workspace }}/.runtime/php-src-phpt
          PHPT_PROGRESS_DIR: ${{ github.workspace }}/.runtime/full-phpt-results/shard-${{ matrix.shard }}
          PTN_PHPT_TEST_TIMEOUT: ${{ inputs.timeout_seconds }}
          PTN_PHPT_RUN_TESTS_JOBS: ${{ inputs.run_tests_jobs }}
          PTN_PHPT_SHARD_TIMEOUT_MINUTES: "120"
        run: |
          set +e
          set -uo pipefail
          mkdir -p "$PHPT_PROGRESS_DIR"
          # Keep PHPT child processes in a separate session so signal-heavy tests
          # cannot kill the runner shell before shard artifacts are uploaded.
          setsid timeout --kill-after=30s "${PTN_PHPT_SHARD_TIMEOUT_MINUTES}m" \
            tools/run-bounded-phpt.sh \
            --classify-harness-programs \
            ".runtime/full-phpt-shards/shard-${{ matrix.shard }}.txt" &
          phpt_pid=$!
          while kill -0 "$phpt_pid" 2>/dev/null; do
            sleep 60
            echo "[full-phpt] shard ${{ matrix.shard }}/${{ inputs.shard_count }} still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          done
          set +e
          wait "$phpt_pid"
          shard_exit=$?
          echo "$shard_exit" > "$PHPT_PROGRESS_DIR/shard-exit-code.txt"
          echo "[full-phpt] shard ${{ matrix.shard }}/${{ inputs.shard_count }} exited with $shard_exit"
          exit 0

      - name: Upload shard artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpt-full-corpus-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            .runtime/full-phpt-shards/shard-${{ matrix.shard }}.txt
            .runtime/full-phpt-results/shard-${{ matrix.shard }}/**

      - name: Fail shard on nonzero PHPT exit
        if: ${{ always() }}
        run: |
          exit_code_path=".runtime/full-phpt-results/shard-${{ matrix.shard }}/shard-exit-code.txt"
          if [[ ! -f "$exit_code_path" ]]; then
            echo "missing shard exit code: $exit_code_path" >&2
            exit 1
          fi
          exit_code="$(cat "$exit_code_path")"
          if [[ "$exit_code" != "0" ]]; then
            echo "PHPT shard ${{ matrix.shard }}/${{ inputs.shard_count }} failed with exit code $exit_code" >&2
            exit "$exit_code"
          fi

  compose-full-phpt-number:
    name: compose full PHPT number
    runs-on: ubuntu-latest
    needs: [full-phpt-shard-a, full-phpt-shard-b]
    if: ${{ always() }}

    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phpt-full-corpus-shard-*
          path: .runtime/full-phpt-artifacts
          merge-multiple: false

      - name: Compose full-corpus result
        run: |
          tools/compose-phpt-full-corpus-results.py \
            --expected-shards "${{ inputs.shard_count }}" \
            --out-dir .runtime/full-phpt-composed \
            .runtime/full-phpt-artifacts

      - name: Add composed result to job summary
        if: ${{ always() }}
        run: |
          if [[ -f .runtime/full-phpt-composed/summary.md ]]; then
            cat .runtime/full-phpt-composed/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload composed result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpt-full-corpus-summary
          if-no-files-found: error
          path: .runtime/full-phpt-composed/**
