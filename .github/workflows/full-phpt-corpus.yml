name: Full PHPT Corpus

on:
  workflow_dispatch:
    inputs:
      php_src_ref:
        description: php/php-src ref to test
        required: true
        default: 8c63ec400ce8e07c57a8d9499317b96a8beafb8b
      timeout_seconds:
        description: Per-PHPT timeout passed to run-tests.php
        required: true
        default: "120"
      run_tests_jobs:
        description: Isolated PHPT worker processes per shard
        required: true
        default: "4"
      batch_size:
        description: PHPT rows per run-tests.php batch before crash fallback
        required: true
        default: "24"
      shard_count:
        description: Number of full-corpus shards to split the run into
        required: true
        default: "30"

permissions:
  contents: read

concurrency:
  group: full-phpt-corpus
  cancel-in-progress: false

jobs:
  plan-full-phpt-shards:
    name: plan full PHPT shards
    runs-on: ubuntu-latest
    outputs:
      first_shards: ${{ steps.shards.outputs.first_shards }}
      second_shards: ${{ steps.shards.outputs.second_shards }}

    steps:
      - name: Build shard matrix
        id: shards
        run: |
          set -euo pipefail
          shard_count='${{ inputs.shard_count }}'
          if ! [[ "$shard_count" =~ ^[0-9]+$ ]] || [[ "$shard_count" -le 1 ]]; then
            echo "shard_count must be an integer greater than 1: $shard_count" >&2
            exit 1
          fi
          python3 - "$shard_count" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          count = int(sys.argv[1])
          split = (count + 1) // 2
          if split > 256 or count - split > 256:
              raise SystemExit(f"shard_count={count} exceeds the two-matrix limit")
          print("first_shards=" + json.dumps(list(range(split))))
          print("second_shards=" + json.dumps(list(range(split, count))))
          PY

  build-phpc:
    name: build phpc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld pkg-config php-cli

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build compiler
        run: cargo build --locked --release --bin phpc

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: phpc-bin
          if-no-files-found: error
          path: target/release/phpc

  full-phpt-shard-a:
    name: shard ${{ matrix.shard }}/${{ inputs.shard_count }}
    needs: [plan-full-phpt-shards, build-phpc]
    runs-on: ubuntu-latest
    timeout-minutes: 2880
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan-full-phpt-shards.outputs.first_shards) }}

    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Checkout PHPT corpus
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: ${{ inputs.php_src_ref }}
          path: .runtime/php-src-phpt

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld pkg-config php-cli

      - name: Download compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: phpc-bin
          path: .runtime/phpc-bin

      - name: Prepare compiler artifact
        run: chmod +x .runtime/phpc-bin/phpc

      - name: Generate full-corpus shard
        env:
          PHP_SRC_PHPT: ${{ github.workspace }}/.runtime/php-src-phpt
        run: |
          tools/phpt-full-corpus-shard.sh \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ inputs.shard_count }}" \
            --out ".runtime/full-phpt-shards/shard-${{ matrix.shard }}.txt"

      - name: Run full-corpus shard
        env:
          PHP_SRC_PHPT: ${{ github.workspace }}/.runtime/php-src-phpt
          PHPT_PROGRESS_DIR: ${{ github.workspace }}/.runtime/full-phpt-results/shard-${{ matrix.shard }}
          PTN_PHPT_TEST_TIMEOUT: ${{ inputs.timeout_seconds }}
          PTN_PHPT_ISOLATED_WORKERS: ${{ inputs.run_tests_jobs }}
          PTN_PHPT_BATCH_SIZE: ${{ inputs.batch_size }}
          PTN_PHPT_SHARD_TIMEOUT_MINUTES: "120"
          PTN_PHPT_SHARD_INDEX: ${{ matrix.shard }}
          PTN_PHPT_SHARD_COUNT: ${{ inputs.shard_count }}
          PHPC_BIN: ${{ github.workspace }}/.runtime/phpc-bin/phpc
        run: |
          set +e
          python3 <<'PY'
          import datetime
          import os
          import pathlib
          import signal
          import subprocess
          import sys
          import time

          shard = os.environ["PTN_PHPT_SHARD_INDEX"]
          shard_count = os.environ["PTN_PHPT_SHARD_COUNT"]
          progress_dir = pathlib.Path(os.environ["PHPT_PROGRESS_DIR"])
          progress_dir.mkdir(parents=True, exist_ok=True)
          shard_manifest = f".runtime/full-phpt-shards/shard-{shard}.txt"
          worker_count = os.environ["PTN_PHPT_ISOLATED_WORKERS"]
          batch_size = os.environ["PTN_PHPT_BATCH_SIZE"]
          test_timeout = os.environ["PTN_PHPT_TEST_TIMEOUT"]
          phpc_bin = os.environ["PHPC_BIN"]
          timeout_seconds = int(os.environ.get("PTN_PHPT_SHARD_TIMEOUT_MINUTES", "120")) * 60
          command = [
              "python3",
              "tools/run-phpt-isolated-manifest.py",
              "--timeout",
              test_timeout,
              "--workers",
              worker_count,
              "--batch-size",
              batch_size,
              "--phpc-bin",
              phpc_bin,
              "--out-dir",
              str(progress_dir),
              shard_manifest,
          ]

          def timestamp() -> str:
              return datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ")

          print(
              f"[full-phpt] shard {shard}/{shard_count} starting at {timestamp()}",
              flush=True,
          )
          process = subprocess.Popen(command, start_new_session=True)
          deadline = time.monotonic() + timeout_seconds
          next_progress = time.monotonic() + 60
          exit_code = None

          try:
              while True:
                  exit_code = process.poll()
                  if exit_code is not None:
                      break
                  now = time.monotonic()
                  if now >= deadline:
                      print(
                          f"[full-phpt] shard {shard}/{shard_count} timed out at {timestamp()}",
                          flush=True,
                      )
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          exit_code = process.wait(timeout=30)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          exit_code = process.wait()
                      if exit_code == 0:
                          exit_code = 124
                      break
                  if now >= next_progress:
                      print(
                          f"[full-phpt] shard {shard}/{shard_count} still running at {timestamp()}",
                          flush=True,
                      )
                      next_progress = now + 60
                  time.sleep(min(5, max(0.1, deadline - now)))
          finally:
              if exit_code is None:
                  exit_code = process.poll()
                  if exit_code is None:
                      try:
                          os.killpg(process.pid, signal.SIGTERM)
                          exit_code = process.wait(timeout=30)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          exit_code = process.wait()
              (progress_dir / "shard-exit-code.txt").write_text(f"{exit_code}\n")
              print(
                  f"[full-phpt] shard {shard}/{shard_count} exited with {exit_code}",
                  flush=True,
              )

          sys.exit(0)
          PY
          supervisor_exit=$?
          if [[ "$supervisor_exit" != "0" ]]; then
            mkdir -p "$PHPT_PROGRESS_DIR"
            if [[ ! -f "$PHPT_PROGRESS_DIR/shard-exit-code.txt" ]]; then
              printf '%s\n' "$supervisor_exit" > "$PHPT_PROGRESS_DIR/shard-exit-code.txt"
            fi
            echo "[full-phpt] supervisor exited with $supervisor_exit; preserving artifacts" >&2
          fi
          exit 0

      - name: Upload shard artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpt-full-corpus-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            .runtime/full-phpt-shards/shard-${{ matrix.shard }}.txt
            .runtime/full-phpt-results/shard-${{ matrix.shard }}/**

      - name: Fail shard on nonzero PHPT exit
        if: ${{ always() }}
        run: |
          exit_code_path=".runtime/full-phpt-results/shard-${{ matrix.shard }}/shard-exit-code.txt"
          if [[ ! -f "$exit_code_path" ]]; then
            echo "missing shard exit code: $exit_code_path" >&2
            exit 1
          fi
          exit_code="$(cat "$exit_code_path")"
          if [[ "$exit_code" != "0" ]]; then
            echo "PHPT shard ${{ matrix.shard }}/${{ inputs.shard_count }} failed with exit code $exit_code" >&2
            exit "$exit_code"
          fi

  full-phpt-shard-b:
    name: shard ${{ matrix.shard }}/${{ inputs.shard_count }}
    needs: [plan-full-phpt-shards, build-phpc]
    runs-on: ubuntu-latest
    timeout-minutes: 2880
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan-full-phpt-shards.outputs.second_shards) }}

    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Checkout PHPT corpus
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: ${{ inputs.php_src_ref }}
          path: .runtime/php-src-phpt

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld pkg-config php-cli

      - name: Download compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: phpc-bin
          path: .runtime/phpc-bin

      - name: Prepare compiler artifact
        run: chmod +x .runtime/phpc-bin/phpc

      - name: Generate full-corpus shard
        env:
          PHP_SRC_PHPT: ${{ github.workspace }}/.runtime/php-src-phpt
        run: |
          tools/phpt-full-corpus-shard.sh \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ inputs.shard_count }}" \
            --out ".runtime/full-phpt-shards/shard-${{ matrix.shard }}.txt"

      - name: Run full-corpus shard
        env:
          PHP_SRC_PHPT: ${{ github.workspace }}/.runtime/php-src-phpt
          PHPT_PROGRESS_DIR: ${{ github.workspace }}/.runtime/full-phpt-results/shard-${{ matrix.shard }}
          PTN_PHPT_TEST_TIMEOUT: ${{ inputs.timeout_seconds }}
          PTN_PHPT_ISOLATED_WORKERS: ${{ inputs.run_tests_jobs }}
          PTN_PHPT_BATCH_SIZE: ${{ inputs.batch_size }}
          PTN_PHPT_SHARD_TIMEOUT_MINUTES: "120"
          PTN_PHPT_SHARD_INDEX: ${{ matrix.shard }}
          PTN_PHPT_SHARD_COUNT: ${{ inputs.shard_count }}
          PHPC_BIN: ${{ github.workspace }}/.runtime/phpc-bin/phpc
        run: |
          set +e
          python3 <<'PY'
          import datetime
          import os
          import pathlib
          import signal
          import subprocess
          import sys
          import time

          shard = os.environ["PTN_PHPT_SHARD_INDEX"]
          shard_count = os.environ["PTN_PHPT_SHARD_COUNT"]
          progress_dir = pathlib.Path(os.environ["PHPT_PROGRESS_DIR"])
          progress_dir.mkdir(parents=True, exist_ok=True)
          shard_manifest = f".runtime/full-phpt-shards/shard-{shard}.txt"
          worker_count = os.environ["PTN_PHPT_ISOLATED_WORKERS"]
          batch_size = os.environ["PTN_PHPT_BATCH_SIZE"]
          test_timeout = os.environ["PTN_PHPT_TEST_TIMEOUT"]
          phpc_bin = os.environ["PHPC_BIN"]
          timeout_seconds = int(os.environ.get("PTN_PHPT_SHARD_TIMEOUT_MINUTES", "120")) * 60
          command = [
              "python3",
              "tools/run-phpt-isolated-manifest.py",
              "--timeout",
              test_timeout,
              "--workers",
              worker_count,
              "--batch-size",
              batch_size,
              "--phpc-bin",
              phpc_bin,
              "--out-dir",
              str(progress_dir),
              shard_manifest,
          ]

          def timestamp() -> str:
              return datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ")

          print(
              f"[full-phpt] shard {shard}/{shard_count} starting at {timestamp()}",
              flush=True,
          )
          process = subprocess.Popen(command, start_new_session=True)
          deadline = time.monotonic() + timeout_seconds
          next_progress = time.monotonic() + 60
          exit_code = None

          try:
              while True:
                  exit_code = process.poll()
                  if exit_code is not None:
                      break
                  now = time.monotonic()
                  if now >= deadline:
                      print(
                          f"[full-phpt] shard {shard}/{shard_count} timed out at {timestamp()}",
                          flush=True,
                      )
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          exit_code = process.wait(timeout=30)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          exit_code = process.wait()
                      if exit_code == 0:
                          exit_code = 124
                      break
                  if now >= next_progress:
                      print(
                          f"[full-phpt] shard {shard}/{shard_count} still running at {timestamp()}",
                          flush=True,
                      )
                      next_progress = now + 60
                  time.sleep(min(5, max(0.1, deadline - now)))
          finally:
              if exit_code is None:
                  exit_code = process.poll()
                  if exit_code is None:
                      try:
                          os.killpg(process.pid, signal.SIGTERM)
                          exit_code = process.wait(timeout=30)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          exit_code = process.wait()
              (progress_dir / "shard-exit-code.txt").write_text(f"{exit_code}\n")
              print(
                  f"[full-phpt] shard {shard}/{shard_count} exited with {exit_code}",
                  flush=True,
              )

          sys.exit(0)
          PY
          supervisor_exit=$?
          if [[ "$supervisor_exit" != "0" ]]; then
            mkdir -p "$PHPT_PROGRESS_DIR"
            if [[ ! -f "$PHPT_PROGRESS_DIR/shard-exit-code.txt" ]]; then
              printf '%s\n' "$supervisor_exit" > "$PHPT_PROGRESS_DIR/shard-exit-code.txt"
            fi
            echo "[full-phpt] supervisor exited with $supervisor_exit; preserving artifacts" >&2
          fi
          exit 0

      - name: Upload shard artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpt-full-corpus-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            .runtime/full-phpt-shards/shard-${{ matrix.shard }}.txt
            .runtime/full-phpt-results/shard-${{ matrix.shard }}/**

      - name: Fail shard on nonzero PHPT exit
        if: ${{ always() }}
        run: |
          exit_code_path=".runtime/full-phpt-results/shard-${{ matrix.shard }}/shard-exit-code.txt"
          if [[ ! -f "$exit_code_path" ]]; then
            echo "missing shard exit code: $exit_code_path" >&2
            exit 1
          fi
          exit_code="$(cat "$exit_code_path")"
          if [[ "$exit_code" != "0" ]]; then
            echo "PHPT shard ${{ matrix.shard }}/${{ inputs.shard_count }} failed with exit code $exit_code" >&2
            exit "$exit_code"
          fi

  compose-full-phpt-number:
    name: compose full PHPT number
    runs-on: ubuntu-latest
    needs: [full-phpt-shard-a, full-phpt-shard-b]
    if: ${{ always() }}

    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phpt-full-corpus-shard-*
          path: .runtime/full-phpt-artifacts
          merge-multiple: false

      - name: Compose full-corpus result
        run: |
          tools/compose-phpt-full-corpus-results.py \
            --expected-shards "${{ inputs.shard_count }}" \
            --out-dir .runtime/full-phpt-composed \
            .runtime/full-phpt-artifacts

      - name: Add composed result to job summary
        if: ${{ always() }}
        run: |
          if [[ -f .runtime/full-phpt-composed/summary.md ]]; then
            cat .runtime/full-phpt-composed/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload composed result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phpt-full-corpus-summary
          if-no-files-found: error
          path: .runtime/full-phpt-composed/**
