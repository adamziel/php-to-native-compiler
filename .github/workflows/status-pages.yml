name: Publish STATUS dashboard

on:
  push:
    branches:
      - master
    paths:
      - STATUS.html
      - STATUS.md
      - tools/status-dashboard-features.tsv
      - tools/update-status-dashboard.sh
      - .github/workflows/status-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Regenerate dashboard
        run: bash tools/update-status-dashboard.sh

      - name: Check generated dashboard
        run: git diff --exit-code -- STATUS.md STATUS.html

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp STATUS.html _site/index.html
          cp STATUS.html _site/STATUS.html
          cp STATUS.md _site/STATUS.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
